<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Website</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #24292f;
            color: white;
            padding: 20px;
            text-align: center;
        }

        main {
            max-width: 800px;
            margin: 60px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-top: 0;
        }

        a {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 20px;
            background: #0969da;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        a:hover {
            background: #0757b5;
        }
    </style>
</head>

<body>
    <header>
        <h2>CieplutkiGit</h2>
    </header>

    <main>
        <h1>Welcome to my website!</h1>
        <p>This website is hosted for free using GitHub Pages.</p>

        <a href="https://github.com/CieplutkiGit">
            Visit my GitHub
        </a>
    </main>
</body>
</html>
