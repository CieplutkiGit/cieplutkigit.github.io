<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090b0b" />
    <meta name="description" content="Entrance to a detective-themed software portfolio." />
    <title>Archive Entrance | Case File Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./src/styles/main.css" />
    <script type="module" src="./src/scripts/main.ts"></script>
  </head>
  <body class="entrance-page">
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="archive-header"></header>

    <main class="archive-entrance" id="main">
      <h1 class="archive-title">
        <img src="./assets/restrictedcropped.png" alt="Restricted case archive" />
      </h1>

      <a class="case-folder" href="./case/" aria-label="Open case file">
        <span class="folder-tab">CASE FILE</span>
        <span class="folder-sheet" aria-hidden="true"></span>
        <span class="folder-front">
          <span class="classification-stamp">CONFIDENTIAL</span>
          <span class="folder-field">
            <span class="field-label">SUBJECT</span>
            <span class="field-value">AGENT 404</span>
          </span>
          <span class="folder-field">
            <span class="field-label">DESIGNATION</span>
            <span class="field-value">Arkadiusz Lewandowski</span>
          </span>
          <span class="folder-action">OPEN CASE FILE <span aria-hidden="true">→</span></span>
        </span>
      </a>

    </main>

    <footer class="archive-status"></footer>
  </body>
</html>
